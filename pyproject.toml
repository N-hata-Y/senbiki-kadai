[project]
name = "senbiki-kadai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "N-hata-Y", email = "yumanakahata@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pdf2image>=1.17.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
senbiki-kadai = "senbiki_kadai:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
